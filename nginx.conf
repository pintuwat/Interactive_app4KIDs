# Static site for Ollie's Phonics. Works on amd64 and arm64 (nginx:alpine is multi-arch).
# MIME types come from the stock /etc/nginx/mime.types (included at http level by nginx.conf in the image).
# NOTE: a `types {}` block here would REPLACE that whole list, so special types are set per location below.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml audio/wav;

    include /etc/nginx/security-headers.conf;

    # Service worker + files that must always be fresh: never cached by the browser HTTP cache.
    location = /service-worker.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /precache.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /env.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /audio/manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # Web app manifest: empty `types {}` + default_type gives it the correct MIME type.
    location = /manifest.json {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve hidden files (regex locations are checked in order, so this comes first).
    location ~ /\. { deny all; }

    # Code and lesson data: revalidate with ETag (cheap 304s); the service worker handles offline.
    location ~* \.(?:html|js|mjs|css|json)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Recorded audio. WAV/WebM are not in the stock mime.types.
    location ~* \.wav$ {
        types { }
        default_type audio/wav;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    location ~* \.webm$ {
        types { }
        default_type audio/webm;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Images and other audio: cache for a week.
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2|mp3|m4a|ogg)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
