# Static site for Ollie's Phonics. Works on amd64 and arm64 (nginx:alpine is multi-arch).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # --- types nginx does not know by default ---
    types {
        application/manifest+json  webmanifest;
        audio/mp4                  m4a;
        audio/wav                  wav;
        audio/webm                 webm;
    }

    include /etc/nginx/security-headers.conf;

    # Service worker + files that must always be fresh: never cached by the browser HTTP cache.
    location = /service-worker.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, no-store, must-revalidate" always; add_header Service-Worker-Allowed "/" always; default_type application/javascript; }
    location = /precache.json     { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /env.js            { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, no-store, must-revalidate" always; default_type application/javascript; }
    location = /audio/manifest.json { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /manifest.json     { include /etc/nginx/security-headers.conf; default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
    location = /index.html        { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /              { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }

    # Code and lesson data: revalidate with ETag (cheap 304s); the service worker handles offline.
    location ~* \.(?:html|js|css|json)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Images and audio: cache for a week.
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2|mp3|m4a|wav|ogg|webm)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }

    # Never serve hidden files.
    location ~ /\. { deny all; }
}
